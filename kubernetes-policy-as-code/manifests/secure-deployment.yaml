# This example satisfies the tutorial's hostPath policy.
apiVersion: apps/v1
kind: Deployment

metadata:
  # Use the same name because this is the corrected workload.
  name: policy-demo

spec:
  # One Pod is enough to demonstrate the policy.
  replicas: 1

  # Identify the Pods managed by this Deployment.
  selector:
    matchLabels:
      app: policy-demo

  template:
    metadata:
      # These labels must match the Deployment's selector.
      labels:
        app: policy-demo

    spec:
      containers:
        - name: demo
          # Use the same image as the rejected example.
          image: busybox:1.36.1

          # Keep the container running for verification.
          command: ["sleep", "3600"]

          # Keep resource consumption small in the training environment.
          resources:
            requests:
              cpu: "10m"
              memory: "16Mi"
            limits:
              cpu: "100m"
              memory: "32Mi"

          volumeMounts:
            # Give the container its own working directory.
            - name: work-data
              mountPath: /work

      volumes:
        - name: work-data
          # Create Pod-local storage without exposing a node directory.
          emptyDir: {}